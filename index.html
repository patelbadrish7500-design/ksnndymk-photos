
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSNNDYMK PHOTOS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101c;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 12px;background:linear-gradient(130deg,#6d28d9,#db2777,#f59e0b)}
h1{margin:0;font-size:27px}
header p{margin-bottom:0}
main{max-width:1000px;margin:auto;padding:16px}
input{width:100%;padding:13px;border:0;border-radius:9px;font-size:16px;margin-bottom:15px}
h2{font-size:20px}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.photo{background:#242438;border-radius:12px;overflow:hidden}
.photo img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:pointer}
.photo p{padding:0 10px;font-size:13px;overflow-wrap:anywhere}
.download{display:block;text-align:center;margin:10px;padding:11px;background:#db2777;color:white;text-decoration:none;border-radius:8px;font-weight:bold}
footer{text-align:center;padding:25px;color:#bbb}
#viewer{display:none;position:fixed;inset:0;background:#000e;z-index:5;align-items:center;justify-content:center;padding:15px}
#viewer img{max-width:100%;max-height:80vh;object-fit:contain}
#close{position:absolute;right:20px;top:15px;font-size:30px;color:white;background:none;border:0}
@media(min-width:650px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>📸 KSNNDYMK PHOTOS</h1>
<p>Garba • Events • Memories</p>
</header>
<main>
<h2>📷 Event Photo Gallery</h2>
<input id="search" placeholder="ફોટાનું નામ શોધો..." oninput="filterPhotos()">
<div class="gallery" id="gallery">

<div class="photo" data-name="garba 20261018 225655">
<img src="./20261018_225655.jpg"
alt="Garba Event Photo" loading="lazy"
onclick="showPhoto(this.src)">
<p>Garba Event Photo</p>
<a class="download" href="./20261018_225655.jpg"
download="KSNNDYMK-Garba-Photo.jpg">⬇ Download Photo</a>
</div>

</div>
<p id="empty" style="display:none;text-align:center">ફોટા મળ્યા નથી.</p>
</main>
<footer>© KSNNDYMK PHOTOS</footer>
<div id="viewer" onclick="closePhoto()">
<button id="close" onclick="closePhoto()">×</button>
<img id="largePhoto" alt="Enlarged photo">
</div>
<script>
function filterPhotos(){
 const q=document.getElementById('search').value.toLowerCase();
 let count=0;
 document.querySelectorAll('.photo').forEach(p=>{
  const match=p.dataset.name.toLowerCase().includes(q);
  p.style.display=match?'':'none';
  if(match)count++;
 });
 document.getElementById('empty').style.display=count?'none':'block';
}
function showPhoto(src){
 document.getElementById('largePhoto').src=src;
 document.getElementById('viewer').style.display='flex';
}
function closePhoto(){
 document.getElementById('viewer').style.display='none';
}
</script>
</body>
</html>
